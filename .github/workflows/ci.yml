name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build (netstandard2.0, net5.0 – net10.0)
        run: dotnet build -c Release

      - name: Unit tests (net8.0, net9.0, net10.0)
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal"

  runtimes:
    # Proves the package really runs on every supported runtime and that the
    # output opens in independent PDF engines. Windows still ships every
    # runtime back to .NET 5 without extra system libraries.
    name: sample on .NET 5–10 + external validation
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            5.0.x
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pikepdf pypdf pypdfium2

      - name: Run sample on every runtime
        shell: bash
        run: |
          dotnet build samples/LifeOS.Pdf.Samples -c Release
          for tfm in net5.0 net6.0 net7.0 net8.0 net9.0 net10.0; do
            dotnet run --project samples/LifeOS.Pdf.Samples -c Release -f $tfm --no-build -- out/$tfm
          done

      - name: Validate with qpdf, pypdf and PDFium
        shell: bash
        run: python tools/validate_pdf.py out/*/showcase.pdf --expect-text "Halaman 2 dari 2" --render-dir out/png

      - uses: actions/upload-artifact@v4
        with:
          name: showcase
          path: out/

  pack:
    name: pack & publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, runtimes]
    runs-on: ubuntu-latest
    env:
      # Empty when the secret is not configured; the push step is then skipped.
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack (version from tag)
        run: dotnet pack src/LifeOS.Pdf -c Release -o artifacts -p:Version=${GITHUB_REF_NAME#v}

      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/*.nupkg

      - name: Push to NuGet.org
        if: ${{ env.NUGET_API_KEY != '' }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
